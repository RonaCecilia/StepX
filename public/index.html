<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slot Booking</title>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#14213d;--mute:#5b6678;--line:#d9dee6;--acc:#0f766e;--acc-ink:#fff;--sel:#f59e0b;--held:#fde7b0;--booked:#e3e6ea;--bookedink:#8a93a1;--err:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--surface:#161f30;--ink:#e8edf5;--mute:#9aa6ba;--line:#2a364b;--acc:#2dd4bf;--acc-ink:#06241f;--sel:#f59e0b;--held:#5a4614;--booked:#222c3d;--bookedink:#6f7b90;--err:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1522;--surface:#161f30;--ink:#e8edf5;--mute:#9aa6ba;--line:#2a364b;--acc:#2dd4bf;--acc-ink:#06241f;--sel:#f59e0b;--held:#5a4614;--booked:#222c3d;--bookedink:#6f7b90;--err:#f97066;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.layout{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
label{font-size:.85rem;color:var(--mute);display:block;margin-bottom:4px}
input[type=date],input[type=text],input[type=tel]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.sessions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sess{flex:1;min-width:130px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.sess b{display:block}.sess span{font-size:.8rem;color:var(--mute)}
.sess[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute);margin-bottom:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:6px;width:100%;min-width:520px}
td{padding:0}
.slot{width:100%;aspect-ratio:1/0.8;min-height:40px;border-radius:6px;border:1.5px solid var(--acc);background:var(--surface);color:var(--ink);font:600 .95rem inherit;cursor:pointer}
.slot:hover{background:color-mix(in srgb,var(--acc) 14%,var(--surface))}
.slot.sel{background:var(--sel);border-color:var(--sel);color:#1a1200}
.slot.held{background:var(--held);border-color:var(--held);color:var(--ink);cursor:not-allowed}
.slot.booked{background:var(--booked);border-color:var(--booked);color:var(--bookedink);cursor:not-allowed;text-decoration:line-through}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.panel h2{font:700 1.1rem Georgia,serif;margin:0 0 10px}
.sum{display:flex;justify-content:space-between;margin:4px 0}
.total{font-weight:700;font-size:1.15rem;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.field{margin:10px 0}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.m{padding:9px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.m[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.btn{width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:700 1rem inherit;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:8px}
.err{color:var(--err);font-size:.88rem;min-height:1.2em;margin:6px 0 0}
.note{font-size:.82rem;color:var(--mute);margin-top:10px}
.ref{font:600 1.05rem ui-monospace,Consolas,monospace;background:var(--bg);border:1px dashed var(--line);padding:8px;border-radius:6px;text-align:center;margin:8px 0}
.timer{font-weight:700;color:var(--sel)}
.ok{color:var(--acc);font-weight:700}
.list{margin-top:18px}.list h2{font:700 1.1rem Georgia,serif;margin:0 0 8px}
.bk{border-top:1px solid var(--line);padding:8px 0;font-size:.92rem}
.bk:first-of-type{border-top:0}
.qr{display:block;width:100%;max-width:280px;margin:8px auto;border-radius:8px;border:1px solid var(--line)}
input.txn{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.adm{display:flex;gap:8px;margin-top:8px}.adm .btn{padding:8px}.btn.red{background:var(--err);color:#fff}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem;margin-top:14px}
.okbar{background:color-mix(in srgb,var(--acc) 16%,var(--surface));border:1.5px solid var(--acc);border-radius:10px;padding:14px 16px;margin:0 0 14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.okbar b{font-size:1.05rem}.okbar small{display:block;color:var(--mute);margin-top:2px;font-size:.88rem}.okbar button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:5px 10px;cursor:pointer;font:inherit;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Slot booking</h1>
  <p class="sub">Pick a date and session, choose your slots, then pay by InstaPay QR. A booking is only confirmed after payment is confirmed.</p>
  <div class="okbar" id="okbar" role="status" aria-live="polite" hidden></div>
  <p class="err" id="banner" style="margin:0 0 12px"></p>
  <div class="layout">
    <div>
      <div class="card">
        <div class="row"><div style="max-width:220px;flex:1"><label for="date">Date</label><input type="date" id="date"></div></div>
        <div class="sessions" id="sessions" role="group" aria-label="Sessions"></div>
        <div class="legend"><span><i style="background:var(--surface);border-color:var(--acc)"></i>Available</span><span><i style="background:var(--sel)"></i>Selected</span><span><i style="background:var(--held)"></i>Awaiting payment</span><span><i style="background:var(--booked)"></i>Booked</span></div>
        <div class="scroll"><table aria-label="Slots"><tbody id="grid"></tbody></table></div>
      </div>
      <button class="link" id="admbtn" style="margin:0 0 12px">Owner sign in</button>
      <div class="card list" id="admin" hidden><h2>Unfinished bookings (not paid yet)</h2><div id="unfin"></div><h2 style="margin-top:16px">Payments to verify</h2><div id="pending"></div><h2 style="margin-top:16px">Confirmed bookings</h2><div id="done"></div><button class="btn ghost" id="dl" style="margin-top:12px">Download spreadsheet (CSV)</button></div>
    </div>
    <aside class="card panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

async function adminAct(id,ok,extra){try{await api("/admin/"+id+"/"+(ok===true?"confirm":ok===false?"reject":ok),extra||{})}catch(e){alert("Could not update.")}await poll()}

document.getElementById("date").value=S.date;document.getElementById("date").min=S.date;
document.getElementById("date").addEventListener("change",function(e){if(!e.target.value||S.pid)return;S.date=e.target.value;S.sel=[];S.receipt=null;poll()});
document.getElementById("sessions").addEventListener("click",function(e){var b=e.target.closest(".sess");if(!b||S.pid)return;S.sess=b.dataset.s;S.sel=[];S.receipt=null;renderAll()});
document.getElementById("grid").addEventListener("click",function(e){var b=e.target.closest(".slot");if(!b||b.disabled||S.pid)return;S.receipt=null;var n=+b.dataset.n,i=S.sel.indexOf(n);if(i>-1)S.sel.splice(i,1);else S.sel.push(n);S.err="";
  var nm=document.getElementById("nm"),ph=document.getElementById("ph");if(nm)S.name=nm.value;if(ph)S.phone=ph.value;renderGrid();renderPanel()});
document.getElementById("panel").addEventListener("click",function(e){var id=e.target.id;
  if(id==="pay")startPay();else if(id==="sub")submitPay();else if(id==="cancel")cancelPay();else if(id==="again"){S.receipt=null;renderAll()}});
document.getElementById("dl").addEventListener("click",async function(){try{var r=await fetch("/api/admin/export.csv",{headers:{Authorization:"Bearer "+token}});if(!r.ok)throw 0;var u=URL.createObjectURL(await r.blob()),l=document.createElement("a");l.href=u;l.download="confirmed-bookings.csv";document.body.appendChild(l);l.click();l.remove()}catch(e){alert("Could not download.")}});
document.getElementById("unfin").addEventListener("click",function(e){var d=e.target.dataset;
  if(d.rel&&confirm("Release these slots? The customer's hold will be cancelled."))adminAct(d.rel,"release");
  else if(d.ext)adminAct(d.ext,"extend");
  else if(d.paid){var t=prompt("Payment reference number (optional). Only mark as paid after you see the money in your MariBank app.");if(t!==null)adminAct(d.paid,"markpaid",{txn:t})}});
document.getElementById("pending").addEventListener("click",function(e){var o=e.target.dataset.ok,n=e.target.dataset.no;if(o)adminAct(o,true);if(n)adminAct(n,false)});
document.getElementById("admbtn").addEventListener("click",async function(){
  if(isAdmin){isAdmin=false;token=null;try{localStorage.removeItem("adm")}catch(e){}return renderAdmin()}
  var pw=prompt("Owner password");if(!pw)return;
  try{var j=await api("/admin/login",{password:pw});token=j.token;isAdmin=true;try{localStorage.setItem("adm",token)}catch(e){}await poll()}catch(e){alert(e.error==="locked"?"Too many attempts. Try again in 10 minutes.":"Wrong password.")}});
setInterval(function(){document.querySelectorAll(".left").forEach(function(el){el.textContent=fmt(Math.round((+el.dataset.exp-Date.now())/1000))});if(S.pid&&S.phase==="awaiting"){var cd=document.getElementById("cd");if(cd)cd.textContent=fmt(secsLeft())}},1000);
setInterval(poll,3000);
function saveMine0(){try{localStorage.removeItem("mine")}catch(e){}}
document.getElementById("okbar").addEventListener("click",function(e){if(e.target.id==="okx"){S.conf=null;saveConf();document.title="Slot Booking";renderOk()}});
try{S.conf=JSON.parse(localStorage.getItem("conf")||"null")}catch(e){}
(async function(){try{var m=JSON.parse(localStorage.getItem("mine")||"null");if(m&&m.pid){var j=await api("/pay/"+m.pid);if(j.status==="awaiting"||j.status==="verifying"){S.pid=j.id;S.phase=j.status;setSnap(j);S.date=j.date;S.sess=j.sess;document.getElementById("date").value=j.date}else if(j.status==="confirmed"){setSnap(j);confirmed(S.snap);saveMine0()}}}catch(e){}
  if(token){isAdmin=true}await poll();renderAll()})();
renderAll();
</script>
</body>
</html>
